name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zloz pakiet SD
        run: |
          PKG="yi-hack-cam-${GITHUB_REF_NAME}"
          mkdir -p "$PKG/yhcam" "$PKG/wifi"
          cp sd/debug.sh "$PKG/debug.sh"
          cp -r sd/yhcam/* "$PKG/yhcam/"
          cp wifi/configure_wifi.sh wifi/configure_wifi.cfg "$PKG/wifi/" 2>/dev/null || true
          cp README.md LICENSE "$PKG/"
          chmod +x "$PKG/debug.sh"
          cd "$PKG/yhcam" && chmod +x yhcam_install.sh hook.sh uninstall.sh bin/* www/cgi-bin/*.sh 2>/dev/null; cd - >/dev/null
          find "$PKG" -type f -exec touch -d "2026-01-01" {} +
          zip -r -9 "$PKG.zip" "$PKG"
          echo "PKG=$PKG.zip" >> "$GITHUB_ENV"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PKG }}
          body: |
            Pakiet na karte SD (FAT32): wypakuj zawartosc ZIP do katalogu glownego karty
            (plik debug.sh i katalog yhcam/ musza wyladowac w ROOT karty, nie w podkatalogu),
            wloz do kamery, zrestartuj. yi-hack sam wykryje debug.sh i zainstaluje panel —
            bez SSH. Panel: http://ADRES_KAMERY/
